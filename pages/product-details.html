<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="theme-color" content="#0b1f3a"><title>Mobile DR | Product Details</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><style>
.details-page{padding:16px 14px 100px}.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}.detail-gallery{width:100%;background:var(--surface-2);overflow:hidden}.detail-slides{display:flex;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}.detail-slides::-webkit-scrollbar{display:none}.detail-slide{flex:0 0 100%;width:100%;height:280px;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;margin:0}.detail-slide img{width:100%;height:100%;object-fit:contain;display:block}.detail-slide:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}.detail-photo-single{height:280px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}.detail-photo-single img{width:100%;height:100%;object-fit:contain}.detail-photo-count{padding:7px 10px;text-align:center;font-size:11px;color:var(--muted);background:var(--surface)}.detail-placeholder{font-size:70px}.detail-body{padding:16px}.back-link{display:inline-block;margin-bottom:12px;font-size:12px;color:var(--blue);font-weight:700}.detail-body h1{font-size:22px;line-height:1.3;margin-bottom:5px}.detail-meta{font-size:12px;color:var(--muted)}.detail-price{font-size:25px;font-weight:900;color:var(--navy);margin:13px 0 5px}.detail-price del{font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.detail-tag{padding:6px 9px;border-radius:16px;background:var(--surface-2);font-size:10px}.detail-section{border-top:1px solid var(--border);padding-top:13px;margin-top:13px}.detail-section h2{font-size:15px;margin-bottom:6px}.detail-section p{font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap}.stock-ok{color:var(--green)!important;font-weight:700}.stock-none{color:var(--red)!important;font-weight:700}.repair-product-btn{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}.not-found{text-align:center;padding:45px 20px}.not-found strong{display:block;margin:10px 0 5px}.not-found p{font-size:11px;color:var(--muted)}
</style></head><body><div id="app">

ef="settings.html" class="drawer-link" data-page="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span data-i18n="settings">सेटिंग्स</span></a><a href="../admin/login.html" class="drawer-link" data-page="admin-login"><span class="nav-icon" aria-hidden="true">🔐</span><span data-i18n="adminLogin">Staff Login</span></a></nav></aside>

</div><script src="../data/translations.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="../js/firebase-config.js"></script><script src="../js/firebase-db.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/navigation.js"></script><script>
"use strict";
const ProductDetails={escape(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));},money(n){return "₹"+Number(n||0).toLocaleString("en-IN");},init(){const id=new URLSearchParams(location.search).get("id");let p=MobileDRStorage.read(MobileDRStorage.keys.products,[]).find(x=>String(x.id)===String(id));const root=document.getElementById("productDetails");if(!p&&window.MobileDRFirebase?.getPublicCollection){window.MobileDRFirebase.getPublicCollection("products").then(list=>{MobileDRStorage.write(MobileDRStorage.keys.products,list);ProductDetails.init();}).catch(()=>{});return;}if(!p){root.innerHTML=`<div class="not-found"><strong>${MobileDR.t("productNotFound","प्रोडक्ट नहीं मिला")}</strong><p>${MobileDR.t("productNotFoundDesc","यह प्रोडक्ट हटाया जा चुका है या लिंक सही नहीं है।")}</p><a class="repair-product-btn" href="products.html">${MobileDR.t("products","प्रोडक्ट्स देखें")}</a></div>`;return;}const images=Array.isArray(p.images)&&p.images.length?p.images.slice(0,5):(p.image?[p.image]:[]);let photoBlock;if(images.length>1){photoBlock=`<div class="detail-gallery"><div class="detail-slides" id="detailSlides" tabindex="0" aria-label="${this.escape(p.name)} की ${images.length} फोटो। ${MobileDR.t("swipeHint","फोटो बदलने के लिए बाएं या दाएं स्वाइप करें।")}">${images.map((src,i)=>`<figure class="detail-slide" data-photo-index="${i}" aria-label="${this.escape(p.name)} फोटो ${i+1} में से ${images.length}"><img src="${this.escape(src)}" alt="${this.escape(p.name)} फोटो ${i+1}"></figure>`).join("")}</div><div class="detail-photo-count" id="detailPhotoCount" aria-live="polite">${MobileDR.t("photoCount","फोटो")} 1 / ${images.length}</div></div>`;}else if(images.length===1){photoBlock=`<div class="detail-photo-single"><img src="${this.escape(images[0])}" alt="${this.escape(p.name)} फोटो 1"></div>`;}else{photoBlock='<div class="detail-photo-single"><span class="detail-placeholder" aria-hidden="true">${MobileDR.t("noPhoto","फोटो नहीं")}</span></div>';}root.innerHTML=`${photoBlock}<div class="detail-body"><h1>${this.escape(p.name)}</h1><div class="detail-meta">${this.escape(p.brand||"")} · ${this.escape(p.category||"")}</div><div class="detail-price">${this.money(p.price)} ${Number(p.oldPrice)>Number(p.price)?`<del>${this.money(p.oldPrice)}</del>`:""}</div><div class="detail-tags"><span class="detail-tag">${this.escape(p.quality||"")}</span><span class="detail-tag">${this.escape(p.warranty||MobileDR.t("noWarranty","No Warranty"))}</span></div><div class="detail-section"><h2>${MobileDR.t("quality","क्वालिटी")}</h2><p>${this.escape(p.qualityDetails||p.quality||MobileDR.t("noInfo","जानकारी उपलब्ध नहीं"))}</p></div><div class="detail-section"><h2>${MobileDR.t("warranty","वारंटी")}</h2><p>${this.escape(p.warrantyTerms||p.warranty||MobileDR.t("noWarranty","No Warranty"))}</p></div>${p.models?`<div class="detail-section"><h2>${MobileDR.t("compatibility","मॉडल / Compatibility")}</h2><p>${this.escape(p.models)}</p></div>`:""}${p.description?`<div class="detail-section"><h2>${MobileDR.t("description","विवरण")}</h2><p>${this.escape(p.description)}</p></div>`:""}<div class="detail-section"><h2>${MobileDR.t("stock","स्टॉक")}</h2><p class="${Number(p.stock||0)>0?"stock-ok":"stock-none"}">${Number(p.stock||0)>0?`${MobileDR.t("available","उपलब्ध")} — ${this.escape(p.stock)} ${MobileDR.t("pieces","पीस")}`:MobileDR.t("outOfStock","अभी स्टॉक में नहीं")}</p></div><a class="repair-product-btn" href="products.html">${MobileDR.t("moreProducts","← और प्रोडक्ट देखें")}</a></div>`;if(images.length>1){const scroller=document.getElementById("detailSlides"),counter=document.getElementById("detailPhotoCount");const update=()=>{const i=Math.max(0,Math.min(images.length-1,Math.round(scroller.scrollLeft/scroller.clientWidth)));counter.textContent=`${MobileDR.t("photoCount","फोटो")} ${i+1} / ${images.length}`;};scroller.addEventListener("scroll",()=>{window.requestAnimationFrame(update)},{passive:true});update();}}};
window.addEventListener("mobileDR:data",e=>{if(e.detail?.collection==="products")location.reload()});window.addEventListener("mobileDR:language",()=>ProductDetails.init());
document.addEventListener("DOMContentLoaded",()=>ProductDetails.init());
</script></body></html>
