<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="theme-color" content="#0b1f3a"><title>Mobile DR | Product Details</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><style>
.details-page{padding:16px 14px 100px}.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}.detail-photo{height:250px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}.detail-photo img{width:100%;height:100%;object-fit:contain}.detail-placeholder{font-size:70px}.detail-body{padding:16px}.back-link{display:inline-block;margin-bottom:12px;font-size:12px;color:var(--blue);font-weight:700}.detail-body h1{font-size:22px;line-height:1.3;margin-bottom:5px}.detail-meta{font-size:12px;color:var(--muted)}.detail-price{font-size:25px;font-weight:900;color:var(--navy);margin:13px 0 5px}.detail-price del{font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.detail-tag{padding:6px 9px;border-radius:16px;background:var(--surface-2);font-size:10px}.detail-section{border-top:1px solid var(--border);padding-top:13px;margin-top:13px}.detail-section h2{font-size:15px;margin-bottom:6px}.detail-section p{font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap}.stock-ok{color:var(--green)!important;font-weight:700}.stock-none{color:var(--red)!important;font-weight:700}.repair-product-btn{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}.not-found{text-align:center;padding:45px 20px}.not-found strong{display:block;margin:10px 0 5px}.not-found p{font-size:11px;color:var(--muted)}
</style></head><body><div id="app">
<header class="app-header"><div class="header-left"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" type="button"><span></span><span></span><span></span></button><a href="../index.html" class="brand"><div class="brand-mark"><span>DR</span></div><div class="brand-text"><strong>MOBILE DR</strong><small data-i18n="brandTagline">Mobile Repair & Accessories</small></div></a></div><div class="header-actions"><button class="icon-btn" id="langBtn" type="button"><span id="langText">EN</span></button><button class="icon-btn" id="themeBtn" type="button"><span id="themeIcon">☾</span></button></div></header>
<div class="drawer-overlay" id="drawerOverlay"></div><aside class="side-drawer" id="sideDrawer" aria-label="Navigation Drawer" aria-hidden="true"><div class="drawer-header"><div class="drawer-brand"><div class="brand-mark"><span>DR</span></div><div><strong>MOBILE DR</strong><small data-i18n="appName">Mobile Shop Management</small></div></div><button class="drawer-close" id="drawerClose" type="button">×</button></div><div class="drawer-profile"><div class="profile-avatar">👤</div><div class="profile-info"><strong data-i18n="customer">ग्राहक</strong><small data-i18n="welcome">Mobile DR में आपका स्वागत है</small></div></div><div class="drawer-lang-selector"><div class="language-selector"><button type="button" class="language-option active" data-lang="hi">हिंदी</button><button type="button" class="language-option" data-lang="en">English</button></div></div><nav class="drawer-nav"><p class="nav-section-title" data-i18n="customerSection">ग्राहक</p><a href="../index.html" class="drawer-link" data-page="home"><span class="nav-icon">⌂</span><span data-i18n="home">होम</span></a><a href="products.html" class="drawer-link" data-page="products"><span class="nav-icon">▣</span><span data-i18n="products">प्रोडक्ट्स</span></a><a href="repair.html" class="drawer-link" data-page="repair"><span class="nav-icon">📱</span><span data-i18n="newRepair">नया रिपेयर</span></a><a href="my-repairs.html" class="drawer-link" data-page="my-repairs"><span class="nav-icon">🛠</span><span data-i18n="myRepairs">मेरे रिपेयर</span></a><p class="nav-section-title" data-i18n="moreSection">अन्य</p><a href="offers.html" class="drawer-link" data-page="offers"><span class="nav-icon">🎁</span><span data-i18n="offers">ऑफर्स</span></a><a href="support.html" class="drawer-link" data-page="support"><span class="nav-icon">💬</span><span data-i18n="support">ग्राहक सहायता</span></a><a href="settings.html" class="drawer-link" data-page="settings"><span class="nav-icon">⚙</span><span data-i18n="settings">सेटिंग्स</span></a><a href="../admin/login.html" class="drawer-link" data-page="admin-login"><span class="nav-icon">🔐</span><span data-i18n="adminLogin">Staff Login</span></a></nav></aside>
<main class="details-page"><a class="back-link" href="products.html">← वापस प्रोडक्ट्स पर</a><section id="productDetails" class="detail-card"></section></main>
<nav class="bottom-nav"><a href="../index.html" class="bottom-nav-item" data-page="home"><span>⌂</span><small data-i18n="home">होम</small></a><a href="products.html" class="bottom-nav-item" data-page="products"><span>🛍</span><small data-i18n="products">प्रोडक्ट</small></a><a href="repair.html" class="bottom-nav-item repair-nav-item" data-page="repair"><span>+</span><small data-i18n="repair">रिपेयर</small></a><a href="my-repairs.html" class="bottom-nav-item" data-page="my-repairs"><span>📋</span><small data-i18n="myRepairs">रिपेयर</small></a></nav>
</div><script src="../data/translations.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="../js/firebase-config.js"></script><script src="../js/firebase-db.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/navigation.js"></script><script>
"use strict";
const ProductDetails={escape(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));},money(n){return "₹"+Number(n||0).toLocaleString("en-IN");},init(){const id=new URLSearchParams(location.search).get("id");let p=MobileDRStorage.read(MobileDRStorage.keys.products,[]).find(x=>String(x.id)===String(id));const root=document.getElementById("productDetails");if(!p&&window.MobileDRFirebase?.getPublicCollection){window.MobileDRFirebase.getPublicCollection("products").then(list=>{MobileDRStorage.write(MobileDRStorage.keys.products,list);ProductDetails.init();}).catch(()=>{});return;}if(!p){root.innerHTML='<div class="not-found"><div>📦</div><strong>प्रोडक्ट नहीं मिला</strong><p>यह प्रोडक्ट हटाया जा चुका है या लिंक सही नहीं है।</p><a class="repair-product-btn" href="products.html">प्रोडक्ट्स देखें</a></div>';return;}const image=p.image?`<img src="${this.escape(p.image)}" alt="${this.escape(p.name)}">`:'<span class="detail-placeholder">📱</span>';root.innerHTML=`<div class="detail-photo">${image}</div><div class="detail-body"><h1>${this.escape(p.name)}</h1><div class="detail-meta">${this.escape(p.brand||"")} · ${this.escape(p.category||"")}</div><div class="detail-price">${this.money(p.price)} ${Number(p.oldPrice)>Number(p.price)?`<del>${this.money(p.oldPrice)}</del>`:""}</div><div class="detail-tags"><span class="detail-tag">${this.escape(p.quality||"")}</span><span class="detail-tag">🛡 ${this.escape(p.warranty||"No Warranty")}</span></div><div class="detail-section"><h2>क्वालिटी</h2><p>${this.escape(p.qualityDetails||p.quality||"जानकारी उपलब्ध नहीं")}</p></div><div class="detail-section"><h2>वारंटी</h2><p>${this.escape(p.warrantyTerms||p.warranty||"No Warranty")}</p></div>${p.models?`<div class="detail-section"><h2>मॉडल / Compatibility</h2><p>${this.escape(p.models)}</p></div>`:""}${p.description?`<div class="detail-section"><h2>विवरण</h2><p>${this.escape(p.description)}</p></div>`:""}<div class="detail-section"><h2>स्टॉक</h2><p class="${Number(p.stock||0)>0?"stock-ok":"stock-none"}">${Number(p.stock||0)>0?`उपलब्ध — ${this.escape(p.stock)} पीस`:"अभी स्टॉक में नहीं"}</p></div><a class="repair-product-btn" href="products.html">← और प्रोडक्ट देखें</a></div>`;}};
window.addEventListener("mobileDR:data",e=>{if(e.detail?.collection==="products")location.reload()});
document.addEventListener("DOMContentLoaded",()=>ProductDetails.init());
</script></body></html>
